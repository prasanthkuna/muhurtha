# Muhūrta — local Supabase CLI config (run `supabase init` to regenerate if needed).
# https://supabase.com/docs/guides/cli/config

project_id = "muhurtha"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://pwa-lyart-phi.vercel.app"
additional_redirect_urls = [
  "https://pwa-lyart-phi.vercel.app/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]

# Enable via: .\scripts\setup-pwa-google-auth.ps1 -GoogleClientId "..." -GoogleClientSecret "..."
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
skip_nonce_check = false

[auth.email]
enable_signup = true
