appId: app.muhurta
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Muhūrta"
    timeout: 30000
- tapOn:
    text: "Begin"
- extendedWaitUntil:
    visible:
      text: "Sign in with phone"
    timeout: 20000
- assertVisible: "Sign in with phone"
- extendedWaitUntil:
    visible:
      text: "Send code"
    timeout: 45000
- assertVisible: "Mobile number"
- assertVisible: "Send code"
