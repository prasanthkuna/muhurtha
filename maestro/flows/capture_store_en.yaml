# Play Store screenshots (en-IN) — requires signed-in session with pack loaded.
appId: app.muhurta
---
- launchApp
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    point: "10%,94%"
- waitForAnimationToEnd
- takeScreenshot:
    path: ../play/assets/screenshots/en-IN/02-decode
- tapOn:
    point: "30%,94%"
- waitForAnimationToEnd
- takeScreenshot:
    path: ../play/assets/screenshots/en-IN/03-life-map
- tapOn:
    point: "50%,94%"
- waitForAnimationToEnd:
    timeout: 12000
- takeScreenshot:
    path: ../play/assets/screenshots/en-IN/01-today
- tapOn:
    point: "70%,94%"
- waitForAnimationToEnd
- takeScreenshot:
    path: ../play/assets/screenshots/en-IN/04-timing
- tapOn:
    point: "90%,94%"
- waitForAnimationToEnd
- takeScreenshot:
    path: ../play/assets/screenshots/en-IN/05-ask
